{% import "macros/_builder_macros.html" as builder_macros %}

<div class="builder-block" data-block-id="{{ block.id }}" data-block-type="{{ block.block_type }}">
    <div class="builder-block-header" style="
        background: {{ getBlockColor(block.block_type) }};
        padding: 12px;
        color: white;
        border-radius: 8px 8px 0 0;
        cursor: move;
        display: flex;
        justify-content: space-between;
        align-items: center;
    ">
        <span class="block-title">{{ block.standard.label }}</span>
        <div class="block-controls">
            <button class="btn-icon" onclick="editBlock('{{ block.id }}')" title="Edit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="btn-icon" onclick="deleteBlock('{{ block.id }}')" title="Delete"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        </div>
    </div>
    
    <div class="builder-block-content" style="padding: 16px; border: 1px solid #e0e0e0; border-top: none;">
        {{ renderBlockPreview(block) }}
    </div>
</div>
