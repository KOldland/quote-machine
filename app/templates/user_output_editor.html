<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Template Editor - Quote Machine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user_output_editor.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<body>
    <!-- Top Toolbar -->
    <div class="editor-toolbar">
        <h1>Output Template Editor - {{ form_key }}</h1>
        <div class="toolbar-actions">
            <button id="save-btn" class="btn btn-primary">Save Template</button>
            <button id="reset-btn" class="btn btn-secondary">Reset to Default</button>
            <a href="/output_editor" class="btn btn-outline">Back to Template List</a>
        </div>
    </div>

    <!-- Main Three-Column Layout -->
    <div class="editor-container">
        
        <!-- Left Sidebar: Section Picker -->
        <div class="sidebar">
            <h3>Sections</h3>
                        <div class="section-list">
                <div class="section-card" data-section="header">
                    <i class="fa-solid fa-heading section-icon"></i>
                    <span class="section-name">Header</span>
                </div>
                <div class="section-card" data-section="body">
                    <i class="fa-solid fa-table-list section-icon"></i>
                    <span class="section-name">Body</span>
                </div>
                <div class="section-card" data-section="footer">
                    <i class="fa-solid fa-shoe-prints section-icon"></i>
                    <span class="section-name">Footer</span>
                </div>
                <div class="section-card" data-section="styling">
                    <i class="fa-solid fa-code section-icon"></i>
                    <span class="section-name">Styling (CSS)</span>
                </div>
            </div>
        </div>

        <!-- Center: Live Preview Pane -->
        <div class="preview-pane">
            <div class="preview-header">
                <h3>Live Preview</h3>
                <button id="refresh-preview-btn" class="btn-small">↻ Refresh</button>
            </div>
            <div class="preview-container">
                <iframe id="preview-frame" src="about:blank"></iframe>
            </div>
        </div>

        <!-- Right Panel: Properties Editor -->
        <div class="properties-panel">
            <h3>Properties</h3>
            <div id="properties-content">
                <!-- Dynamic content based on selected section -->
                <p class="placeholder-text">Select a section to edit its properties</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/user_output_editor.js') }}"></script>
</body>
</html>
